<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:2560px;height:640px;overflow:hidden;background:#0d0c10;font-family:'Inter',sans-serif;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 88% 50%,#1f2a10 0%,#0d0c10 55%,#09080b 100%)}
.lines{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 14px)}
.edge{position:absolute;left:0;top:0;bottom:0;width:8px;background:#c6f432}
.sl1{position:absolute;right:760px;top:-80px;width:34px;height:800px;background:#c6f432;transform:skewX(-20deg)}
.sl2{position:absolute;right:700px;top:-80px;width:70px;height:800px;background:rgba(198,244,50,.28);transform:skewX(-20deg)}
.logo{position:absolute;left:130px;top:150px;width:210px;height:150px;background:#c6f432;transform:skewX(-14deg);border-radius:6px}
.logo svg{position:absolute;left:0;top:0;transform:skewX(14deg)}
.t{position:absolute;left:400px;top:128px;color:#f2f2f5;font-weight:900;font-size:140px;letter-spacing:10px;line-height:1}
.t b{color:#c6f432}
.by{position:absolute;left:402px;top:292px;color:#f2f2f5;font-weight:800;font-size:40px;letter-spacing:1px}
.pill{position:absolute;left:150px;top:392px;padding:18px 44px 18px 56px;background:#1a1c26;border:2px solid #3a3e4d;color:#d6d6de;font-size:38px;letter-spacing:1px;transform:skewX(-14deg)}
.pill span{display:inline-block;transform:skewX(14deg)}
.dia{position:absolute;left:112px;top:416px;width:24px;height:24px;background:#c6f432;transform:rotate(45deg)}
.bars{position:absolute;left:150px;top:540px;display:flex;gap:14px}
.bars i{display:block;width:96px;height:8px;transform:skewX(-20deg)}
.tile{position:absolute;right:130px;top:60px;width:520px;height:520px;border-radius:44px;border:2px solid #3a3e4d;overflow:hidden;box-shadow:0 0 60px rgba(198,244,50,.12)}
.tile img{width:100%;height:100%;display:block}
</style></head><body>
<div class="bg"></div><div class="lines"></div><div class="edge"></div><div class="sl2"></div><div class="sl1"></div>
<div class="logo"><svg width="210" height="150" viewBox="0 0 210 150"><g fill="none" stroke="#0d0c10" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M62 98 V84 A43 43 0 0 1 148 84 V98"/></g><g fill="#0d0c10"><rect x="50" y="88" width="22" height="38" rx="9"/><rect x="138" y="88" width="22" height="38" rx="9"/></g></svg></div>
<div class="t">HEAR<b>BRIDGE</b> PS4</div>
<div class="by">Developed by X-F1REBALL-X</div>
<div class="dia"></div><div class="pill"><span>Bluetooth audio for PS4</span></div>
<div class="bars"><i style="background:#ff6a2b"></i><i style="background:#ffb02b"></i><i style="background:#c6f432"></i><i style="background:#2bc4ff"></i><i style="background:#ff6ac9"></i></div>
<div class="tile"><img src="icon0_render.png"></div>
</body></html>
